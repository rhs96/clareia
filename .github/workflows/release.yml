name: Publish signed Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: ./tests/maintenance.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Clareia v__VERSION__
          releaseBody: 'Instalador Windows x64 e atualização assinada. Consulte o histórico de alterações no repositório.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

