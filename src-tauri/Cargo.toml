[package]
name = "clareia"
version = "0.3.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
ferrisetw = "1"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Etw", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

